services:
  n8n:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: n8n-pandoc
    restart: unless-stopped
    ports:
      - "5678:5678"
    environment:
      # Trust corporate MITM/root CA
      NODE_OPTIONS: "--use-openssl-ca"
      NODE_EXTRA_CA_CERTS: "/etc/ssl/certs/corp-root.pem"

      # n8n base settings
      TZ: "Asia/Singapore"
      N8N_PORT: "5678"
      
      # Public URL - update if needed
      N8N_PROTOCOL: "http"
      N8N_HOST: "alignment-rolls-differently-proud.trycloudflare.com"
      N8N_EDITOR_BASE_URL: "https://alignment-rolls-differently-proud.trycloudflare.com"
      WEBHOOK_URL: "https://alignment-rolls-differently-proud.trycloudflare.com"

      # Encryption key - CHANGE THIS IN PRODUCTION
      N8N_ENCRYPTION_KEY: "3aYILRn9CdFZaEjrCOc0e38bgu2TpQ/O"

      # Disable permission warning
      N8N_ENFORCE_SETTINGS_FILE_PERMISSIONS: "false"

      # Database - PostgreSQL
      DB_TYPE: "postgresdb"
      DB_POSTGRESDB_HOST: "postgres"
      DB_POSTGRESDB_PORT: "5432"
      DB_POSTGRESDB_DATABASE: "n8n_db"
      DB_POSTGRESDB_USER: "postgres"
      DB_POSTGRESDB_PASSWORD: "postgres123"

      # Community packages
      N8N_COMMUNITY_PACKAGES_ENABLED: "true"
      N8N_COMMUNITY_PACKAGES_FILE: "/home/node/.n8n/community-packages.json"

      # Other settings
      N8N_RUNNERS_ENABLED: "false"  # Disabled for simplicity
      N8N_BLOCK_ENV_ACCESS_IN_NODE: "false"
      N8N_GIT_NODE_DISABLE_BARE_REPOS: "true"
      N8N_BINARY_DATA_MAX_SIZE: "2147483648"
      N8N_BINARY_DATA_MODE: "filesystem"

    volumes:
      # Certificate
      - ./certs/corp-root.pem:/etc/ssl/certs/corp-root.pem:ro
      # n8n data
      - n8n_data:/home/node/.n8n
      # Community packages node_modules
      - n8n_node_modules:/home/node/.n8n/n8n-community-packages/node_modules
      
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - n8n-network

  postgres:
    image: pgvector/pgvector:pg15
    container_name: n8n-postgres
    restart: unless-stopped
    ports:
      - "5433:5432"  # Host:5433 -> Container:5432
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres123
      POSTGRES_DB: n8n_db
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - n8n-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5
  
  telegram-host:
    build:
      context: ./telethon
      dockerfile: Dockerfile
    container_name: telegram-host
    restart: unless-stopped
    environment:
      TZ: "Asia/Singapore"
      TELEGRAM_API_ID: "${TELEGRAM_API_ID}"      # put in .env
      TELEGRAM_API_HASH: "${TELEGRAM_API_HASH}"  # put in .env
      TELEGRAM_BOT_TOKEN: "${TELEGRAM_BOT_TOKEN}"
      RELAY_CHAT_ID: "${RELAY_CHAT_ID}"
      TELEGRAM_SESSION_NAME: "matthew_main"
      TELEGRAM_SESSION_DIR: "/sessions"
      TELEGRAM_DOWNLOAD_DIR: "/downloads"
    ports:
      - "9000:9000"             # Optional: expose to host; if only n8n needs it, you can omit and use internal DNS
    volumes:
      - telethon_sessions:/sessions
      - telethon_downloads:/downloads
    networks:
      - n8n-network

volumes:
  n8n_data:
  n8n_node_modules:
  postgres_data:
  telethon_sessions:
  telethon_downloads:

networks:
  n8n-network:
    driver: bridge